<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin &mdash; ATZI Advisory</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23fff'/><polygon points='22,7 3,57 41,57' fill='%230C1A2E'/><polygon points='42,7 23,57 61,57' fill='%232F6BEB'/><polygon points='32,33.3 41,57 23,57' fill='%23173463'/><rect x='11' y='38.5' width='22' height='3.8' fill='%23fff'/><rect x='31' y='38.5' width='22' height='3.8' fill='%23fff'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C1A2E;--blue:#2F6BEB;--blue-dk:#2453C4;--ink:#1B2436;--body:#41506A;--muted:#6B7A93;
--line:#E3E9F2;--soft:#F5F8FC;--ok:#12A87B;--warn:#C9822C;--bad:#B4402F;
--serif:'Lora',Georgia,serif;--sans:'Inter',-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--soft);color:var(--body);font-size:14.5px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);font-weight:600;line-height:1.2}
header{background:var(--navy);color:#fff;padding:14px 0}
header .bar{display:flex;align-items:center;justify-content:space-between}
header .lg{display:flex;align-items:center;gap:10px}
header .n1{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.5px}
header .tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#7FA9F5;font-weight:700}
header button{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;padding:7px 14px;border-radius:7px;font-family:var(--sans);font-size:.8rem;cursor:pointer}
/* gate */
.gate{max-width:390px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;text-align:center;box-shadow:0 8px 30px rgba(12,26,46,.07)}
.gate h2{margin-bottom:6px}
.gate p{font-size:.86rem;color:var(--muted);margin-bottom:18px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:.93rem;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,235,.11)}
.btn{background:var(--blue);color:#fff;border:none;padding:11px 20px;border-radius:9px;font-family:var(--sans);font-weight:600;font-size:.9rem;cursor:pointer;transition:.13s}
.btn:hover{background:var(--blue-dk)} .btn:disabled{opacity:.5;cursor:default}
.btn.w{width:100%;margin-top:12px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:22px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat .n{font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--ink);line-height:1}
.stat .l{font-size:.72rem;color:var(--muted);margin-top:5px;letter-spacing:.03em}
.stat.g .n{color:var(--ok)}
/* toolbar */
.tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tools input,.tools select{width:auto;flex:0 0 auto;padding:9px 12px;font-size:.88rem}
.tools input[type=search]{flex:1;min-width:200px}
/* deal card */
.deal{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.deal.dead{opacity:.62}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px;cursor:pointer}
.dhead:hover{background:#FAFCFF}
.dtitle{font-family:var(--serif);font-size:1.06rem;font-weight:600;color:var(--ink)}
.dmeta{font-size:.82rem;color:var(--muted);margin-top:3px}
.dright{text-align:right;flex:0 0 auto}
.chip{display:inline-block;font-size:.71rem;font-weight:700;padding:4px 11px;border-radius:20px;letter-spacing:.03em}
.chip.stage{background:#EAF1FE;color:var(--blue)}
.chip.won{background:#E4F6EE;color:var(--ok)}
.chip.dead{background:#FBEAE7;color:var(--bad)}
.chip.stale{background:#FBF2E4;color:var(--warn);margin-left:6px}
.dbody{display:none;padding:0 20px 20px;border-top:1px solid var(--line)}
.deal.open .dbody{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.lbl{font-size:.71rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
.row{display:flex;gap:7px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;font-family:var(--sans);font-size:.81rem;cursor:pointer;transition:.12s}
.sbtn:hover{border-color:var(--blue);color:var(--blue)}
.sbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sbtn.kill{border-color:#F0CFC8;color:var(--bad)}
.sbtn.kill:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.sbtn.win{border-color:#BFE3D0;color:var(--ok)}
.sbtn.win:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
.fld{margin-top:12px}
.fld textarea{min-height:62px;resize:vertical;font-size:.88rem}
.info{font-size:.84rem;color:var(--body);margin-top:6px}
.info b{color:var(--ink)}
a.folder{font-size:.82rem;color:var(--blue)}
.msg{padding:12px 15px;border-radius:9px;font-size:.88rem;margin-bottom:14px;display:none}
.msg.ok{display:block;background:#E9F6EF;color:#1B6B47;border:1px solid #BFE3D0}
.msg.err{display:block;background:#FDEDEA;color:#A33A28;border:1px solid #F3CFC8}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:44px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="lg">
      <svg width="30" height="30" viewBox="0 0 64 64"><polygon points="22,7 3,57 41,57" fill="#fff" opacity=".93"/><polygon points="42,7 23,57 61,57" fill="#2F6BEB"/><polygon points="32,33.3 41,57 23,57" fill="#23457F"/><rect x="11" y="38.5" width="22" height="3.8" fill="#0C1A2E"/><rect x="31" y="38.5" width="22" height="3.8" fill="#0C1A2E"/></svg>
      <span class="n1">ATZI</span><span class="tag">Admin</span>
    </div>
    <button id="out" class="hide">Sign out</button>
  </div>
</header>

<div class="wrap gate" id="gate">
  <h2>Admin access</h2>
  <p>Enter your passcode to manage deals.</p>
  <div class="msg" id="gmsg"></div>
  <input type="password" id="pass" placeholder="Passcode" autocomplete="current-password">
  <button class="btn w" id="go">Open console</button>
</div>

<div class="wrap hide" id="app" style="padding-top:22px;padding-bottom:60px">
  <div class="msg" id="msg"></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search by property, name or email">
    <select id="filter">
      <option value="active">Active deals</option>
      <option value="all">All deals</option>
      <option value="Out to Lenders">Out to Lenders</option>
      <option value="Term Sheet Issued">Term Sheet Issued</option>
      <option value="In Diligence">In Diligence</option>
      <option value="won">Closed won</option>
      <option value="dead">Not proceeding</option>
    </select>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div id="list"></div>
</div>

<script>
var GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwl72XOJgQqp5CdjNwdPgGH-TFCU66S0xQmhcrYjqAW0HTujvffWWw7p2ywflWH3Vv/exec';
var pass='', DEALS=[], STAGES=[], OUTCOMES=[];

function $(i){return document.getElementById(i)}
function post(b){
  b.passcode=pass;
  return fetch(GOOGLE_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})
    .then(function(r){return r.json()});
}
function money(v){
  var n=parseFloat(String(v).replace(/[^0-9.]/g,''));
  return isNaN(n)?'-':'$'+Math.round(n).toLocaleString('en-US');
}
function note(el,type,text){el.className='msg '+type;el.innerHTML=text;
  if(type==='ok') setTimeout(function(){el.className='msg'},4000);}

/* ---- sign in ---- */
$('go').onclick=function(){
  var v=$('pass').value.trim();
  if(!v) return;
  var b=$('go'); b.disabled=true; b.innerHTML='<span class="spin"></span>Checking';
  pass=v;
  post({action:'adminLogin'}).then(function(r){
    if(!r||!r.success) throw new Error((r&&r.error)||'Failed');
    try{sessionStorage.setItem('atzi_admin',v)}catch(e){}
    $('gate').classList.add('hide'); $('app').classList.remove('hide'); $('out').classList.remove('hide');
    load();
  }).catch(function(err){
    pass='';
    note($('gmsg'),'err',String(err.message||err));
  }).finally(function(){b.disabled=false;b.textContent='Open console'});
};
$('pass').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
$('out').onclick=function(){
  pass=''; try{sessionStorage.removeItem('atzi_admin')}catch(e){}
  $('app').classList.add('hide'); $('out').classList.add('hide'); $('gate').classList.remove('hide'); $('pass').value='';
};
$('refresh').onclick=function(){load()};
$('q').oninput=render; $('filter').onchange=render;

/* ---- load ---- */
function load(){
  $('list').innerHTML='<div class="empty">Loading deals&hellip;</div>';
  post({action:'adminDeals'}).then(function(r){
    if(!r||!r.success) throw new Error((r&&r.error)||'Failed');
    DEALS=r.deals||[]; STAGES=r.stages||[]; OUTCOMES=r.outcomes||[];
    stats(r.stats||{}); render();
  }).catch(function(err){
    note($('msg'),'err','Could not load deals. '+(err.message||''));
    $('list').innerHTML='';
  });
}

function stats(s){
  var items=[['Active',s.active,''],['Out to lenders',s.outToLenders,''],['Term sheets',s.termSheets,''],
             ['Closed won',s.closed,'g'],['Volume closed',money(s.closedVolume),'g'],['Fees earned',money(s.feesEarned),'g']];
  $('stats').innerHTML=items.map(function(i){
    return '<div class="stat '+i[2]+'"><div class="n">'+i[1]+'</div><div class="l">'+i[0]+'</div></div>';
  }).join('');
}

/* ---- render ---- */
function render(){
  var q=$('q').value.toLowerCase(), fl=$('filter').value;
  var out=DEALS.filter(function(d){
    var dead=d.outcome&&d.outcome!=='Closed Won';
    var won=d.outcome==='Closed Won'||d.stage==='Closed';
    if(fl==='active'&&(dead||won)) return false;
    if(fl==='won'&&!won) return false;
    if(fl==='dead'&&!dead) return false;
    if(['Out to Lenders','Term Sheet Issued','In Diligence'].indexOf(fl)>-1&&d.stage!==fl) return false;
    if(q){
      var hay=(d.property+' '+d.name+' '+d.email+' '+d.company).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  if(!out.length){$('list').innerHTML='<div class="empty">No deals match this view.</div>';return}
  $('list').innerHTML=out.map(card).join('');
  bind();
}

function card(d){
  var dead=d.outcome&&d.outcome!=='Closed Won';
  var won=d.outcome==='Closed Won'||d.stage==='Closed';
  var chip=dead?'<span class="chip dead">'+d.outcome+'</span>'
        :won?'<span class="chip won">Closed won</span>'
        :'<span class="chip stage">'+d.stage+'</span>';
  var stale=(!dead&&!won&&d.daysInStage!==''&&d.daysInStage>10)
        ?'<span class="chip stale">'+d.daysInStage+'d in stage</span>':'';
  var stageBtns=STAGES.map(function(s){
    return '<button class="sbtn '+(s===d.stage?'on':'')+'" data-a="stage" data-v="'+s+'" data-t="'+d.token+'">'+s+'</button>';
  }).join('');
  var killBtns=OUTCOMES.filter(function(o){return o!=='Closed Won'}).map(function(o){
    return '<button class="sbtn kill" data-a="outcome" data-v="'+o+'" data-t="'+d.token+'">'+o+'</button>';
  }).join('');
  return '<div class="deal '+(dead?'dead':'')+'" id="d-'+d.token+'">'+
    '<div class="dhead" data-toggle="'+d.token+'">'+
      '<div><div class="dtitle">'+(d.property||'(no address)')+'</div>'+
      '<div class="dmeta">'+(d.name||'')+(d.company?' &middot; '+d.company:'')+' &middot; '+(d.amount||'')+' &middot; '+(d.purpose||'')+' &middot; Ref '+d.token+'</div></div>'+
      '<div class="dright">'+chip+stale+'<div class="dmeta" style="margin-top:6px">'+d.received+'</div></div>'+
    '</div>'+
    '<div class="dbody">'+
      '<div class="grid2">'+
        '<div>'+
          '<div class="lbl">Move to stage</div><div class="row">'+stageBtns+'</div>'+
          '<div class="fld"><div class="lbl">Where things stand (client sees this)</div>'+
          '<textarea id="n-'+d.token+'" placeholder="e.g. Package is with six lenders, quotes expected Thursday">'+(d.nextStep||'')+'</textarea>'+
          '<div class="row" style="margin-top:8px">'+
            '<button class="sbtn" data-a="note" data-t="'+d.token+'">Save note</button>'+
            '<button class="sbtn" data-a="note-notify" data-t="'+d.token+'">Save &amp; email client</button>'+
          '</div></div>'+
          '<div class="fld"><div class="lbl">Request documents (emails the client)</div>'+
          '<textarea id="doc-'+d.token+'" placeholder="Rent roll, 2024 tax returns, insurance binder">'+(d.docsRequested||'')+'</textarea>'+
          '<div class="row" style="margin-top:8px"><button class="sbtn" data-a="docs" data-t="'+d.token+'">Send request</button></div></div>'+
        '</div>'+
        '<div>'+
          '<div class="lbl">Close the deal</div>'+
          '<div class="row"><input id="amt-'+d.token+'" placeholder="Loan amount at close" style="flex:1;min-width:150px">'+
          '<button class="sbtn win" data-a="won" data-t="'+d.token+'">Mark closed won</button></div>'+
          '<div class="info">Fee is recorded at 1% of the amount entered.</div>'+
          '<div class="lbl" style="margin-top:18px">Deal did not proceed</div><div class="row">'+killBtns+'</div>'+
          '<div class="fld"><textarea id="r-'+d.token+'" placeholder="Reason or note (optional)"></textarea></div>'+
          (dead?'<div class="row" style="margin-top:10px"><button class="sbtn" data-a="reopen" data-t="'+d.token+'">Reopen deal</button></div>':'')+
          '<div class="info" style="margin-top:14px">'+
            '<b>Contact:</b> '+(d.email||'')+(d.phone?' &middot; '+d.phone:'')+'<br>'+
            (d.closedAmount?'<b>Closed:</b> '+money(d.closedAmount)+' &middot; fee '+money(d.feeEarned)+'<br>':'')+
            (d.folder?'<a class="folder" href="'+d.folder+'" target="_blank">Open Drive folder &rarr;</a>':'')+
          '</div>'+
          '<div class="lbl" style="margin-top:18px">Underwriting model</div>'+
          '<div class="row">'+
            '<button class="sbtn" data-a="uw-download" data-t="'+d.token+'">Download underwriting</button>'+
            '<label class="sbtn" style="cursor:pointer">Upload filled underwriting'+
              '<input type="file" id="uwf-'+d.token+'" data-t="'+d.token+'" accept=".xlsx" style="display:none">'+
            '</label>'+
          '</div>'+
          '<div class="info" id="uwmsg-'+d.token+'" style="margin-top:8px"></div>'+
        '</div>'+
      '</div>'+
    '</div></div>';
}

function bind(){
  document.querySelectorAll('[data-toggle]').forEach(function(h){
    h.onclick=function(){document.getElementById('d-'+h.dataset.toggle).classList.toggle('open')};
  });
  document.querySelectorAll('.dbody [data-a]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var t=b.dataset.t, a=b.dataset.a, body={action:'adminAction',token:t};
      if(a==='stage'){ body.what='stage'; body.value=b.dataset.v; }
      else if(a==='outcome'){
        if(!confirm('Mark this deal as "'+b.dataset.v+'"? The file will be archived in Drive.')) return;
        body.what='outcome'; body.value=b.dataset.v;
        body.note=($('r-'+t)||{}).value||'';
      }
      else if(a==='won'){
        var amt=($('amt-'+t)||{}).value||'';
        if(!amt){alert('Enter the loan amount at close first.');return}
        if(!confirm('Mark this deal closed won at '+amt+'?')) return;
        body.what='outcome'; body.value='Closed Won'; body.amount=amt;
      }
      else if(a==='note'||a==='note-notify'){
        body.what='note'; body.note=($('n-'+t)||{}).value||''; body.notify=(a==='note-notify');
      }
      else if(a==='docs'){
        body.what='docs'; body.note=($('doc-'+t)||{}).value||'';
        if(!body.note){alert('List the documents you need first.');return}
      }
      else if(a==='reopen'){ body.what='reopen'; body.value='Under Review'; }

      var label=b.textContent; b.disabled=true; b.textContent='Working...';
      post(body).then(function(r){
        if(!r||!r.success) throw new Error((r&&r.error)||'Failed');
        note($('msg'),'ok',r.message||'Saved');
        var deal=DEALS.filter(function(x){return x.token===t})[0];
        if(deal){
          if(body.what==='stage') deal.stage=body.value;
          if(body.what==='note') deal.nextStep=body.note;
          if(body.what==='docs') deal.docsRequested=body.note;
        }
        if(body.what==='stage'){
          var wrap=document.getElementById('d-'+t);
          if(wrap){ wrap.querySelectorAll('[data-a="stage"]').forEach(function(sb){
            sb.classList.toggle('on', sb.dataset.v===body.value); }); }
        }
        if(body.what==='outcome'||body.what==='reopen') load();
        b.disabled=false; b.textContent=label;
      }).catch(function(err){
        note($('msg'),'err','That did not save. '+(err.message||''));
        b.disabled=false; b.textContent=label;
      });
    };
  });
  document.querySelectorAll('[data-a="uw-download"]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var t=b.dataset.t, m=$('uwmsg-'+t);
      b.disabled=true; var lbl=b.textContent; b.textContent='Preparing...';
      post({action:'adminTemplate',token:t}).then(function(r){
        b.disabled=false; b.textContent=lbl;
        if(!r||!r.success){ m.innerHTML='<span style="color:#B4402F">'+((r&&r.error)||'Error')+'</span>'; return; }
        if(!r.hasTemplate){ m.innerHTML='<span style="color:#C9822C">'+r.message+'</span>'; return; }
        window.open(r.downloadUrl,'_blank');
        m.innerHTML='Downloaded <b>'+r.fileName+'</b>';
      }).catch(function(err){ b.disabled=false; b.textContent=lbl;
        m.innerHTML='<span style="color:#B4402F">'+(err.message||'Error')+'</span>'; });
    };
  });
  document.querySelectorAll('input[type=file][id^="uwf-"]').forEach(function(inp){
    inp.onchange=function(){
      var t=inp.dataset.t, m=$('uwmsg-'+t), file=inp.files[0];
      if(!file) return;
      m.innerHTML='Uploading <b>'+file.name+'</b>&hellip;';
      var reader=new FileReader();
      reader.onload=function(){
        var b64=String(reader.result).split(',')[1];
        post({action:'adminSaveUw',token:t,fileName:file.name,
              mimeType:file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
              data:b64}).then(function(r){
          if(!r||!r.success){ m.innerHTML='<span style="color:#B4402F">'+((r&&r.error)||'Upload failed')+'</span>'; return; }
          m.innerHTML='Saved to the deal folder as <b>'+r.savedAs+'</b>. <a class="folder" href="'+r.folderUrl+'" target="_blank">Open folder &rarr;</a>';
          inp.value='';
        }).catch(function(err){ m.innerHTML='<span style="color:#B4402F">'+(err.message||'Upload failed')+'</span>'; });
      };
      reader.readAsDataURL(file);
    };
  });
}

/* resume a session on refresh */
(function(){
  try{
    var saved=sessionStorage.getItem('atzi_admin');
    if(saved){ pass=saved; $('pass').value=saved; $('go').click(); }
  }catch(e){}
})();
</script>
</body>
</html>
